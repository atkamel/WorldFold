# Minimal cloth-angle RSSM world model config.
# Grid resolution, action dim, angle unit/convention are dataset properties
# and must match the EpisodeStore the data was collected with.

data:
  episode_dir: outputs/cloth_angles/episodes
  grid_size: 11            # matches ClothFoldEnv's CLOTH_COUNT (mujuco/sim_main.py)
  action_dim: 14           # matches ClothFoldEnv's 14-dim bimanual action space
  angle_unit: radians
  angle_convention: signed # "signed" in [-pi, pi], or "unsigned" in [0, pi]
  seq_len: 16
  held_out_fraction: 0.2   # split by episode, not by transition

# Latent sizing note: the GRU state receives only (z, action) -- observations
# reach the model SOLELY through the posterior z sample. The original 8x8
# categoricals with 1.0 free bits pinned KL at the floor all training and gave
# a ~0.05 rad reconstruction floor, worse than the active-transition motion
# scale (~0.035): the bottleneck was information, not data. Hence the wider
# latent, higher free-bits ceiling, and softer KL weight.
model:
  encoder_hidden: [256, 128]
  h_dim: 256
  n_categoricals: 16
  n_classes: 16
  mlp_hidden: 256
  kl_free_bits: 3.0
  kl_weight: 0.2
  huber_delta: 1.0
  decode_mode: delta   # predict per-step CHANGE; zero output == persistence, so
                       # everything learned is improvement over "no change"

train:
  batch_size: 32
  seq_len: 16
  learning_rate: 3.0e-4
  grad_clip: 100.0
  train_steps: 20000
  eval_every: 500
  mixed_precision: false   # enable only once the float32 baseline is stable
  seed: 0
  checkpoint_dir: outputs/cloth_angles/checkpoints

eval:
  open_loop_horizons: [5, 10]
  n_eval_sequences: 32
  active_threshold_rad: 0.02

# Conditional angle-field DPM (EXPERIMENTS.md sections 1-2): denoises the full
# field conditioned on (masked field, mask). Trained on the train split only,
# with random flap-occlusion severities spanning both experimental strata.
diffusion:
  timesteps: 100
  hidden_dim: 512
  time_embed_dim: 64
  train_steps: 60000   # heavy-occlusion probe MAE was still descending at 20k
  batch_size: 128
  learning_rate: 2.0e-4
  min_severity: 0.05
  max_severity: 0.65
  eval_every: 2000
  checkpoint_dir: outputs/cloth_angles/diffusion
  extra_frames_path: outputs/cloth_angles/perception_frames.npz
  seed: 0

# Keypoint head (M4): frozen-WM latent -> corner displacements from episode
# start, for planner cost evaluation in imagination.
keypoint:
  hidden_dim: 256
  seq_len: 16
  batch_size: 64
  learning_rate: 3.0e-4
  train_steps: 6000
  eval_every: 500
  checkpoint_dir: outputs/cloth_angles/keypoint
  seed: 0
